<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR STYLES */
         .header{
            background: #ffffff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            height: 87px;
            position:sticky;
            top: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        
        }
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        .sidebar.hidden {
            left: -250px;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            
        }

        .sidebar ul {
            list-style: none;
            padding: 0 10px;
            background-color: #34495e;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            display: block;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .sidebar ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
            padding-left: 20px;
        }

        .sidebar ul li a.active {
            background: rgba(255, 255, 255, 0.3);
            border-left: 4px solid white;
            padding-left: 20px;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: none;
            border: none;
            cursor: pointer;
            color: #667eea;
            font-size: 28px;
            width: 40px;
            height: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: #667eea;
            border-radius: 3px;
            transition: 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            margin-left: 250px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 250px);
            background: white;
            min-height: 100vh;
            padding: 0px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background-color: #f4f6f9;
            padding: 40px;
            border-radius: 1%;
            margin: 10px;

        }

        .header1 {
            text-align: center;
            margin-bottom: 40px;
            color: rgb(0, 0, 0);
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: white;
            color: #3498db;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: #667eea;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Filter Section */
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .filter-group select, .filter-group input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        /* Sessions Grid */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .session-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .session-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            position: static;
        }

        .session-header {
            background: #2c3e50;
            color: white;
            padding: 20px;
                position: relative;
        }

        .session-header h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .session-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: rgba(255,255,255,0.3);
        }

        .status-active {
            background: #59b67b;
        }

        .status-upcoming {
            background: #2196f3;
        }

        .status-completed {
            background: #9b59b6;
        }

        .session-body {
            padding: 20px;
        }

        .session-detail {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            color: #555;
            font-size: 14px;
        }

        .session-detail-icon {
            font-size: 20px;
            min-width: 24px;
        }

        .session-detail-content {
            flex: 1;
        }

        .session-detail-label {
            font-weight: bold;
            color: #333;
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .session-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .btn-small {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-attendance {
            background: #478349;
            color: white;
        }

        .btn-attendance:hover {
            background: #45a049;
        }

        .btn-report {
            background: #537b9b;
            color: white;
        }

        .btn-report:hover {
            background: #0b7dda;
        }

        .btn-edit {
            background: #ff9800;
            color: white;
        }

        .btn-edit:hover {
            background: #e68900;
        }

        /* No Sessions */
        .no-sessions {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            color: #999;
        }

        .no-sessions-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .no-sessions-title {
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-buttons {
            margin-top: 20px;
            text-align: right;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-close {
            background: #999;
            color: white;
        }

        .btn-close:hover {
            background: #777;
        }

        .error-message {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
            padding: 15px;
            background: #ffebee;
            border-radius: 6px;
        }

        .success-message {
            color: #1b5e20;
            border-left: 4px solid #4caf50;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .sidebar {
                width: 100%;
                height: 100%;
                left: -100%;
                max-width: none;
            }

            .sidebar.hidden {
                left: -100%;
            }

            .sidebar:not(.hidden) {
                left: 0;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding-top: 0px;
            }

            .header h1 {
                font-size: 24px;
            }

            .sessions-grid {
                grid-template-columns: 1fr;
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .modal-content {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</button>

<nav class="sidebar" id="sidebar">
    <h2>Portal</h2>
    <ul>
        <li><a href="home.html" onclick="setActive(this)">Home</a></li>
        <li><a href="addStudent.html" onclick="setActive(this)">Add Student</a></li>
        <li><a href="search.html" onclick="setActive(this)">Search Student</a></li>
        <li><a href="schedule.html" class="active">Schedule</a></li>
        <li><a href="training-schedule.html" onclick="setActive(this)">Training Schedule</a></li>
        <li><a href="../jobs/browse-jobs.html" onclick="setActive(this)">Jobs</a></li>
        <li><a href="../trainer/trainers.html" onclick="setActive(this)">Trainers</a></li>
        <li style="border-top: 1px solid rgba(255,255,255,0.2); margin-top: 15px; padding-top: 15px;">
            <a href="../jobs/home.html" onclick="setActive(this)">Job Portal</a>
        </li>
    </ul>
</nav>

<div class="main-content">
      <div class="header">
       
    </div>
<div class="container">
    <div class="header1">
        <h1>📅 Schedule Management</h1>
        <p>Create and manage training sessions</p>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-primary" onclick="goToCreateSession()">
            ➕ Create New Session
        </button>
        <button class="btn btn-secondary" onclick="reloadSessions()">
            🔄 Refresh
        </button>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <div class="filter-group">
            <label>📊 Filter by Status:</label>
            <select id="statusFilter" onchange="filterSessions()">
                <option value="">All Sessions</option>
                <option value="active">Active</option>
                <option value="upcoming">Upcoming</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <div class="filter-group">
            <label>👥 Filter by Batch:</label>
            <select id="batchFilter" onchange="filterSessions()">
                <option value="">All Batches</option>
            </select>
        </div>

        <div class="filter-group">
            <label>👨‍🏫 Filter by Trainer:</label>
            <select id="trainerFilter" onchange="filterSessions()">
                <option value="">All Trainers</option>
            </select>
        </div>
    </div>

    <!-- Sessions Grid -->
    <div class="sessions-grid" id="sessionsGrid"></div>
    
    <div id="noSessions" class="no-sessions" style="display:none;">
        <div class="no-sessions-icon">📭</div>
        <div class="no-sessions-title">No Sessions Found</div>
        <p>Create a new session to get started!</p>
    </div>
</div>

<!-- Modal -->
<div id="responseModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Notification</div>
        <div id="modalMessage"></div>
        <div class="modal-buttons">
            <button class="btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<script>
const SESSION_API = "http://localhost:8080/sessions";
const TRAINER_API = "http://localhost:8080/trainers";
let allSessions = [];

// SIDEBAR TOGGLE
const SidebarState = {
    STORAGE_KEY: 'sidebarState',
    ACTIVE_KEY: 'activePage',
    saveSidebarState(isHidden) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ hidden: isHidden }));
    },
    getSidebarState() {
        const state = localStorage.getItem(this.STORAGE_KEY);
        return state ? JSON.parse(state).hidden : false;
    },
    saveActivePage(href) {
        localStorage.setItem(this.ACTIVE_KEY, href);
    },
    getActivePage() {
        return localStorage.getItem(this.ACTIVE_KEY) || '';
    }
};

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isCurrentlyHidden = sidebar.classList.contains('hidden');
    sidebar.classList.toggle('hidden');
    hamburger.classList.toggle('active');
    SidebarState.saveSidebarState(!isCurrentlyHidden);
}

function restoreSidebarState() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isSidebarHidden = SidebarState.getSidebarState();
    if (isSidebarHidden && window.innerWidth > 768) {
        sidebar.classList.add('hidden');
        hamburger.classList.add('active');
    }
}

function setActive(element) {
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    element.classList.add('active');
    const href = element.getAttribute('href');
    if (href) SidebarState.saveActivePage(href);
}

function restoreActiveLink() {
    const activePage = SidebarState.getActivePage();
    if (activePage) {
        const link = document.querySelector(`.sidebar a[href="${activePage}"]`);
        if (link) link.classList.add('active');
    }
}

document.querySelectorAll('.sidebar a').forEach(link => {
    link.addEventListener('click', function() {
        setActive(this);
        if (window.innerWidth <= 768) setTimeout(() => toggleSidebar(), 100);
    });
});

document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    if (!sidebar.contains(event.target) && !hamburger.contains(event.target)) {
        if (window.innerWidth <= 768 && !sidebar.classList.contains('hidden')) toggleSidebar();
    }
});

window.addEventListener('DOMContentLoaded', function() {
    restoreSidebarState();
    restoreActiveLink();
}, { once: true });

function showModal(message, type = 'info') {
    const modal = document.getElementById('responseModal');
    const msgDiv = document.getElementById('modalMessage');
    
    if (type === 'error') {
        msgDiv.innerHTML = `<div class="error-message">${message}</div>`;
    } else if (type === 'success') {
        msgDiv.innerHTML = `<div class="success-message">${message}</div>`;
    }
    
    modal.classList.add('show');
}

function closeModal() {
    document.getElementById('responseModal').classList.remove('show');
}

window.onclick = function(event) {
    const modal = document.getElementById('responseModal');
    if (event.target === modal) {
        closeModal();
    }
}

function goToCreateSession() {
    window.location.href = "create-session.html";
}

function goToAttendance(sessionId) {
    window.location.href = `session-attendance.html?id=${sessionId}`;
}

function goToReport(sessionId) {
    window.location.href = `attendance-report.html?id=${sessionId}`;
}

function getSessionStatus(session) {
    const now = new Date();
    const sessionDate = new Date(session.date + 'T' + session.startTime);
    const endDate = new Date(session.date + 'T' + session.endTime);
    
    if (now < sessionDate) return 'upcoming';
    if (now > endDate) return 'completed';
    return 'active';
}

function getStatusBadge(status) {
    const badges = {
        'active': { class: 'status-active', text: '🔴 Active' },
        'upcoming': { class: 'status-upcoming', text: '🔵 Upcoming' },
        'completed': { class: 'status-completed', text: '✓ Completed' }
    };
    const badge = badges[status] || badges['upcoming'];
    return badge;
}

function renderSessions(sessions) {
    if (!sessions || sessions.length === 0) {
        document.getElementById('sessionsGrid').innerHTML = '';
        document.getElementById('noSessions').style.display = 'block';
        return;
    }

    document.getElementById('noSessions').style.display = 'none';

    let html = "";
    sessions.forEach(session => {
        const status = getSessionStatus(session);
        const badge = getStatusBadge(status);
        
        html += `
        <div class="session-card">
            <div class="session-header">
                <h3>${session.sessionName}</h3>
                <span class="session-status ${badge.class}">${badge.text}</span>
            </div>

            <div class="session-body">
                <div class="session-detail">
                    <span class="session-detail-icon">📅</span>
                    <div class="session-detail-content">
                        <span class="session-detail-label">Date</span>
                        <span>${session.date}</span>
                    </div>
                </div>

                <div class="session-detail">
                    <span class="session-detail-icon">⏰</span>
                    <div class="session-detail-content">
                        <span class="session-detail-label">Time</span>
                        <span>${session.startTime} - ${session.endTime}</span>
                    </div>
                </div>

                <div class="session-detail">
                    <span class="session-detail-icon">👥</span>
                    <div class="session-detail-content">
                        <span class="session-detail-label">Batch</span>
                        <span>${session.batchId}</span>
                    </div>
                </div>

                <div class="session-detail">
                    <span class="session-detail-icon">👨‍🏫</span>
                    <div class="session-detail-content">
                        <span class="session-detail-label">Trainer</span>
                        <span>${session.trainer ? session.trainer.name : 'Not Assigned'}</span>
                    </div>
                </div>
            </div>

            <div class="session-footer">
                <button class="btn-small btn-attendance" onclick="goToAttendance(${session.id})">
                    Mark Attendance
                </button>
                <button class="btn-small btn-report" onclick="goToReport(${session.id})">
                    View Report
                </button>
            </div>
        </div>`;
    });

    document.getElementById('sessionsGrid').innerHTML = html;
}

function filterSessions() {
    const statusFilter = document.getElementById('statusFilter').value;
    const batchFilter = document.getElementById('batchFilter').value;
    const trainerFilter = document.getElementById('trainerFilter').value;

    let filtered = allSessions;

    if (statusFilter) {
        filtered = filtered.filter(s => {
            const status = getSessionStatus(s);
            return status === statusFilter;
        });
    }

    if (batchFilter) {
        filtered = filtered.filter(s => s.batchId === batchFilter);
    }

    if (trainerFilter) {
        filtered = filtered.filter(s => 
            s.trainer && s.trainer.id == trainerFilter
        );
    }

    renderSessions(filtered);
}

function populateFilters() {
    // Get unique batches
    const batches = [...new Set(allSessions.map(s => s.batchId))];
    const batchSelect = document.getElementById('batchFilter');
    batches.forEach(batch => {
        const option = document.createElement('option');
        option.value = batch;
        option.textContent = batch;
        batchSelect.appendChild(option);
    });

    // Get unique trainers
    const trainers = [...new Set(allSessions
        .filter(s => s.trainer)
        .map(s => s.trainer.id))];
    
    const trainerSelect = document.getElementById('trainerFilter');
    allSessions.forEach(session => {
        if (session.trainer) {
            const existing = Array.from(trainerSelect.options)
                .some(opt => opt.value == session.trainer.id);
            if (!existing) {
                const option = document.createElement('option');
                option.value = session.trainer.id;
                option.textContent = session.trainer.name;
                trainerSelect.appendChild(option);
            }
        }
    });
}

function reloadSessions() {
    loadSessions();
}

async function loadSessions() {
    try {
        const res = await fetch(SESSION_API);
        
        if (!res.ok) {
            const text = await res.text();
            let errorMessage = 'Failed to load sessions';
            try {
                const data = JSON.parse(text);
                errorMessage = data.message || data.error || 'Failed to load sessions';
            } catch {}
            showModal(errorMessage, 'error');
            return;
        }

        const sessions = await res.json();
        allSessions = sessions || [];
        
        // Clear and repopulate filters
        document.getElementById('batchFilter').innerHTML = '<option value="">All Batches</option>';
        document.getElementById('trainerFilter').innerHTML = '<option value="">All Trainers</option>';
        
        populateFilters();
        renderSessions(allSessions);

    } catch (err) {
        showModal('Error loading sessions: ' + err.message, 'error');
    }
}

// Load sessions on page load
loadSessions();
</script>

</div>
</div>

</body>
</html>
