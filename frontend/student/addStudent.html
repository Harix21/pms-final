<h1>Student Management System</h1>

<!-- FORM -->
<form id="studentForm">
    <input type="text" id="vhno" placeholder="VHNO" required>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Edit Student</div>
        <form id="editForm">
            <input type="hidden" id="editVhno">
            <input type="text" id="editName" placeholder="Name" required>
            <input type="email" id="editEmail" placeholder="Email">
            <input type="text" id="editPhno" placeholder="Phone">
            
            <select id="editYear">
                <option value="">Year</option>
                <option>1st</option>
                <option>2nd</option>
                <option>3rd</option>
                <option>4th</option>
            </select>
            
            <select id="editBatchId">
                <option value="">Batch</option>
                <option>Super 76</option>
                <option>Strivers</option>
                <option>Aspirants</option>
            </select>
            
            <input type="number" id="editAttendance" placeholder="Attendance">
            
            <select id="editPlacementStatus">
                <option value="">Placement Status</option>
                <option>Placed</option>
                <option>Not Placed</option>
            </select>
            
            <input type="date" id="editDob">
            
            <select id="editGender">
                <option value="">Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>
            
            <input type="password" id="editPassword" placeholder="Password">

            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button type="submit" class="btn-save">Update</button>
            </div>
        </form>
    </div>
</div>

<script>

const API = "http://localhost:8080/api/students";
const RECORDS_PER_PAGE = 10;
let allStudents = [];
let currentPage = 1;

// LOAD ALL STUDENTS
function loadStudents() {
    fetch(API)
        .then(res => res.json())
        .then(data => {
            allStudents = data;
            currentPage = 1;
            displayPage(1);
            updatePagination();
        });
}

// DISPLAY CURRENT PAGE
function displayPage(pageNum) {
    const startIdx = (pageNum - 1) * RECORDS_PER_PAGE;
    const endIdx = startIdx + RECORDS_PER_PAGE;
    const pageData = allStudents.slice(startIdx, endIdx);

    const table = document.getElementById("studentTable");
    table.innerHTML = "";

    pageData.forEach(s => {
        table.innerHTML += `
            <tr>
                <td>${s.vhno}</td>
                <td>${s.name}</td>
                <td>${s.email}</td>
                <td>${s.phno}</td>
                <td>${s.year}</td>
                <td>
                    <button onclick="editStudent('${s.vhno}')">Edit</button>
                    <button onclick="deleteStudent('${s.vhno}')">Delete</button>
                </td>
            </tr>
        `;
    });

    // Update record count
    const totalRecords = allStudents.length;
    const displayedFrom = startIdx + 1;
    const displayedTo = Math.min(endIdx, totalRecords);
    document.getElementById("recordCount").textContent = 
        `Showing ${displayedFrom}-${displayedTo} of ${totalRecords} records`;
}

// UPDATE PAGINATION CONTROLS
function updatePagination() {
    const totalPages = Math.ceil(allStudents.length / RECORDS_PER_PAGE);
    const paginationDiv = document.getElementById("paginationControls");
    paginationDiv.innerHTML = "";

    // Previous button
    if (currentPage > 1) {
        paginationDiv.innerHTML += `<button onclick="goToPage(${currentPage - 1})">← Previous</button>`;
    } else {
        paginationDiv.innerHTML += `<button disabled class="disabled">← Previous</button>`;
    }

    // Page numbers
    for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
            paginationDiv.innerHTML += `<span class="active">${i}</span>`;
        } else {
            paginationDiv.innerHTML += `<button onclick="goToPage(${i})">${i}</button>`;
        }
    }

    // Next button
    if (currentPage < totalPages) {
        paginationDiv.innerHTML += `<button onclick="goToPage(${currentPage + 1})">Next →</button>`;
    } else {
        paginationDiv.innerHTML += `<button disabled class="disabled">Next →</button>`;
    }
}

// GO TO PAGE
function goToPage(pageNum) {
    currentPage = pageNum;
    displayPage(pageNum);
    updatePagination();
    window.scrollTo(0, 0); // Scroll to top
}

// SAVE STUDENT
document.getElementById("studentForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const newVhno = document.getElementById("vhno").value.trim();
    const newEmail = document.getElementById("email").value.trim();
    const newPhno = document.getElementById("phno").value.trim();
    const newName = document.getElementById("name").value.trim();

    // Validation - Check if required fields are filled
    if (!newName) {
        alert("❌ Name is required!");
        return;
    }

    // Check for duplicates
    const duplicate = allStudents.find(s => 
        (newEmail && s.email === newEmail && s.vhno !== newVhno) || 
        (newPhno && s.phno === newPhno && s.vhno !== newVhno) || 
        (newVhno && s.vhno === newVhno)
    );

    if (duplicate) {
        let duplicateFields = [];
        if (newVhno && duplicate.vhno === newVhno) duplicateFields.push(`Vehicle: ${newVhno}`);
        if (newEmail && duplicate.email === newEmail) duplicateFields.push(`Email: ${newEmail}`);
        if (newPhno && duplicate.phno === newPhno) duplicateFields.push(`Phone: ${newPhno}`);
        
        alert("❌ Duplicate Student Found!\n\n" + duplicateFields.join("\n") + "\n\nAlready exists in the database!");
        return;
    }

    // No duplicates found, proceed with adding
    const student = {
        vhno: newVhno,
        name: newName,
        email: newEmail,
        phno: newPhno,
        year: document.getElementById("year").value,
        batchId: document.getElementById("batchId").value,
        attendance: document.getElementById("attendance").value,
        placementStatus: document.getElementById("placementStatus").value,
        dob: document.getElementById("dob").value,
        gender: document.getElementById("gender").value,
        password: document.getElementById("password").value
    };

    fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
    })
    .then(() => {
        alert("✅ Student Saved Successfully!");
        document.getElementById("studentForm").reset();
        loadStudents();
    });
});

// DELETE
function deleteStudent(vhno) {
    fetch(`${API}/${vhno}`, { method: "DELETE" })
    .then(() => {
        alert("Deleted!");
        loadStudents();
    });
}

// EDIT - Open Modal
let currentEditingStudent = null;
function editStudent(vhno) {
    fetch(`${API}/${vhno}`)
    .then(res => res.json())
    .then(s => {
        currentEditingStudent = s;
        document.getElementById("editVhno").value = s.vhno;
        document.getElementById("editName").value = s.name;
        document.getElementById("editEmail").value = s.email || "";
        document.getElementById("editPhno").value = s.phno || "";
        document.getElementById("editYear").value = s.year || "";
        document.getElementById("editBatchId").value = s.batchId || "";
        document.getElementById("editAttendance").value = s.attendance || "";
        document.getElementById("editPlacementStatus").value = s.placementStatus || "";
        document.getElementById("editDob").value = s.dob || "";
        document.getElementById("editGender").value = s.gender || "";
        document.getElementById("editPassword").value = s.password || "";
        
        document.getElementById("editModal").style.display = "block";
    });
}

// Close Edit Modal
function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
    currentEditingStudent = null;
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById("editModal");
    if (event.target === modal) {
        modal.style.display = "none";
        currentEditingStudent = null;
    }
}

// UPDATE STUDENT
document.getElementById("editForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const vhno = document.getElementById("editVhno").value;
    const newEmail = document.getElementById("editEmail").value.trim();
    const newPhno = document.getElementById("editPhno").value.trim();
    const newName = document.getElementById("editName").value.trim();

    // Validation
    if (!newName) {
        alert("❌ Name is required!");
        return;
    }

    // Only check for duplicates if email/phone have changed
    const emailChanged = newEmail !== currentEditingStudent.email;
    const phnoChanged = newPhno !== currentEditingStudent.phno;

    if (emailChanged || phnoChanged) {
        const duplicate = allStudents.find(s => s.vhno !== vhno && (
            (emailChanged && newEmail && s.email === newEmail) || 
            (phnoChanged && newPhno && s.phno === newPhno)
        ));

        if (duplicate) {
            let duplicateFields = [];
            if (emailChanged && newEmail && duplicate.email === newEmail) duplicateFields.push(`Email: ${newEmail}`);
            if (phnoChanged && newPhno && duplicate.phno === newPhno) duplicateFields.push(`Phone: ${newPhno}`);
            alert("❌ Duplicate Found!\n\n" + duplicateFields.join("\n") + "\n\nAlready exists!");
            return;
        }
    }

    const updatedStudent = {
        vhno: vhno,
        name: newName,
        email: newEmail,
        phno: newPhno,
        year: document.getElementById("editYear").value,
        batchId: document.getElementById("editBatchId").value,
        attendance: document.getElementById("editAttendance").value,
        placementStatus: document.getElementById("editPlacementStatus").value,
        dob: document.getElementById("editDob").value,
        gender: document.getElementById("editGender").value,
        password: document.getElementById("editPassword").value
    };

    fetch(`${API}/${vhno}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedStudent)
    })
    .then(() => {
        alert("✅ Student Updated Successfully!");
        closeEditModal();
        loadStudents();
    });
});

// INITIAL LOAD
loadStudents();

// PERSISTENT SIDEBAR STATE MANAGEMENT
const SidebarState = {
    STORAGE_KEY: 'sidebarState',
    ACTIVE_KEY: 'activePage',
    
    saveSidebarState(isHidden) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ hidden: isHidden }));
    },
    
    getSidebarState() {
        const state = localStorage.getItem(this.STORAGE_KEY);
        return state ? JSON.parse(state).hidden : false;
    },
    
    saveActivePage(href) {
        localStorage.setItem(this.ACTIVE_KEY, href);
    },
    
    getActivePage() {
        return localStorage.getItem(this.ACTIVE_KEY) || '';
    },
    
    clearState() {
        localStorage.removeItem(this.STORAGE_KEY);
        localStorage.removeItem(this.ACTIVE_KEY);
    }
};

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isCurrentlyHidden = sidebar.classList.contains('hidden');
    
    sidebar.classList.toggle('hidden');
    hamburger.classList.toggle('active');
    
    SidebarState.saveSidebarState(!isCurrentlyHidden);
}

function restoreSidebarState() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isSidebarHidden = SidebarState.getSidebarState();
    
    if (isSidebarHidden && window.innerWidth > 768) {
        sidebar.classList.add('hidden');
        hamburger.classList.add('active');
    }
}

function setActive(element) {
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    element.classList.add('active');
    
    const href = element.getAttribute('href');
    if (href) {
        SidebarState.saveActivePage(href);
    }
}

function restoreActiveLink() {
    const activePage = SidebarState.getActivePage();
    if (activePage) {
        const link = document.querySelector(`.sidebar a[href="${activePage}"]`);
        if (link) {
            link.classList.add('active');
        }
    }
}

document.querySelectorAll('.sidebar a').forEach(link => {
    link.addEventListener('click', function() {
        setActive(this);
        if (window.innerWidth <= 768) {
            setTimeout(() => toggleSidebar(), 100);
        }
    });
});

document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    if (!sidebar.contains(event.target) && !hamburger.contains(event.target)) {
        if (window.innerWidth <= 768 && !sidebar.classList.contains('hidden')) {
            toggleSidebar();
        }
    }
});

window.addEventListener('DOMContentLoaded', function() {
    restoreSidebarState();
    restoreActiveLink();
}, { once: true });

</script>
