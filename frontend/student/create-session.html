<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Session</title>

    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR STYLES */
         .header{
            background: #ffffff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            height: 87px;
            position:sticky;
            top: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        
        }
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        .sidebar.hidden {
            left: -250px;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            
        }

        .sidebar ul {
            list-style: none;
            padding: 0 10px;
            background-color: #34495e;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            display: block;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .sidebar ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
            padding-left: 20px;
        }

        .sidebar ul li a.active {
            background: rgba(255, 255, 255, 0.3);
            border-left: 4px solid white;
            padding-left: 20px;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: none;
            border: none;
            cursor: pointer;
            color: #667eea;
            font-size: 28px;
            width: 40px;
            height: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: #667eea;
            border-radius: 3px;
            transition: 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }
  /* MAIN CONTENT */
        .main-content {
            flex: 1;
            margin-left: 250px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 250px);
            
        }

        h1 {
            text-align: center;
        }
        .container {
            max-width: 100%;
            margin: auto;
            background-color: #d4dce7;
            padding: 30px;
            margin: 20px;
            border-radius: 1%;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .form-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            color: #3b3c3d;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin: 20px;
            max-width: 700px;
            border-left: #2c3e50 solid 5px;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .form-row label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .form-row input,
        .form-row select,
        .form-row textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-row input:focus,
        .form-row select:focus,
        .form-row textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        .form-row textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        .helper-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .error-message {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
            padding: 15px;
            background: #ffebee;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success-message {
            color: #1b5e20;
            border-left: 4px solid #4caf50;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 20px;
            }

            .form-row-group {
                grid-template-columns: 1fr;
            }

            .form-buttons {
                flex-direction: column;
            }

            .form-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <!-- SIDEBAR -->
<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</button>

<nav class="sidebar" id="sidebar">
   
    <h2> Portal</h2>
    
    <ul>
        <li><a href="home.html" onclick="setActive(this)">Home</a></li>
        <li><a href="addStudent.html" onclick="setActive(this)">Add Student</a></li>
        <li><a href="search.html" onclick="setActive(this)">Search Student</a></li>
        <li><a href="schedule.html" class="active">Schedule</a></li>
       
        <li><a href="training-schedule.html" onclick="setActive(this)">Training Schedule</a></li>
        <li><a href="../jobs/browse-jobs.html" onclick="setActive(this)">Jobs</a></li>
        <li><a href="../trainer/trainers.html" onclick="setActive(this)">Trainers</a></li>
        <li style="border-top: 1px solid rgba(255,255,255,0.2); margin-top: 15px; padding-top: 15px;">
            <a href="jobs/home.html" onclick="setActive(this)">Job Portal</a>
        </li>
    </ul>
</nav>

    
<div class="main-content">
    <div class="header">
       
    </div><center>
<div class="container">
    <div class="form-header">
        <h1>➕ Create New Session</h1>
        <p style="color: #3b3c3d; opacity: 0.9;">Schedule a new training session</p>
    </div>

    <div class="form-card">
        <div id="messageDiv"></div>

        <form id="sessionForm">
            <div class="form-row">
                <label for="sessionName">📝 Session Name *</label>
                <input type="text" id="sessionName" placeholder="e.g., Java Advanced - Day 3" required>
                <div class="helper-text">Give a descriptive name for this session</div>
            </div>

            <div class="form-row-group">
                <div class="form-row">
                    <label for="date">📅 Date *</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-row">
                    <label for="startTime">🕐 Start Time *</label>
                    <input type="time" id="startTime" required>
                </div>
            </div>

            <div class="form-row-group">
                <div class="form-row">
                    <label for="endTime">🕑 End Time *</label>
                    <input type="time" id="endTime" required>
                </div>

                <div class="form-row">
                    <label for="batchId">👥 Batch ID *</label>
                    <select id="batchId" required>
                        <option value="Super 76">Super 76</option>
                         <option value="Strivers">Strivers</option>
                          <option value="Aspirants">Aspirants</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <label for="trainerId">👨‍🏫 Assign Trainer *</label>
                <select id="trainerId" required>
                    <option value="">Select a trainer</option>
                </select>
                <div class="helper-text">Choose a trainer to take attendance</div>
            </div>

            <div class="form-row">
                <label for="description">📖 Description (Optional)</label>
                <textarea id="description" placeholder="Add details about this session..."></textarea>
            </div>

            <div class="form-buttons">
                <button type="button" class="btn btn-cancel" onclick="goBack()">Cancel</button>
                <button type="submit" class="btn btn-submit">Create Session</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Creating session...</p>
        </div>
    </div>
</div>
</center>
</div>
<script>
const SESSION_API = "http://localhost:8080/sessions";
const TRAINER_API = "http://localhost:8080/trainers";
const STUDENT_API = "http://localhost:8080/students";

async function loadTrainers() {
    try {
        const res = await fetch(TRAINER_API);
        if (!res.ok) return;
        
        const trainers = await res.json();
        const select = document.getElementById('trainerId');
        
        trainers.forEach(trainer => {
            const option = document.createElement('option');
            option.value = trainer.id;
            option.textContent = `${trainer.name} (${trainer.expertise})`;
            select.appendChild(option);
        });
    } catch (err) {
        console.error('Error loading trainers:', err);
    }
}

async function loadBatches() {
    try {
        const res = await fetch(STUDENT_API);
        if (!res.ok) return;
        
        const students = await res.json();
        const batches = [...new Set(students.map(s => s.batchId).filter(b => b))];
        const select = document.getElementById('batchId');
        
        batches.forEach(batch => {
            const option = document.createElement('option');
            option.value = batch;
            option.textContent = batch;
            select.appendChild(option);
        });
    } catch (err) {
        console.error('Error loading batches:', err);
    }
}

function showMessage(message, type = 'info') {
    const msgDiv = document.getElementById('messageDiv');
    
    if (type === 'error') {
        msgDiv.innerHTML = `<div class="error-message">${message}</div>`;
    } else if (type === 'success') {
        msgDiv.innerHTML = `<div class="success-message">${message}</div>`;
    } else {
        msgDiv.innerHTML = '';
    }
}

document.getElementById('sessionForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const sessionName = document.getElementById('sessionName').value.trim();
    const date = document.getElementById('date').value;
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    const batchId = document.getElementById('batchId').value;
    const trainerId = document.getElementById('trainerId').value;
    const description = document.getElementById('description').value.trim();

    // Validation
    if (!sessionName || !date || !startTime || !endTime || !batchId || !trainerId) {
        showMessage('Please fill all required fields', 'error');
        return;
    }

    if (startTime >= endTime) {
        showMessage('Start time must be before end time', 'error');
        return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('sessionForm').style.opacity = '0.5';
    document.getElementById('sessionForm').style.pointerEvents = 'none';

    try {
        const payload = {
            sessionName,
            date,
            startTime,
            endTime,
            batchId,
            trainer: { id: trainerId },
            active: true
        };

        const res = await fetch(SESSION_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('sessionForm').style.opacity = '1';
        document.getElementById('sessionForm').style.pointerEvents = 'auto';

        if (!res.ok) {
            const text = await res.text();
            let errorMessage = 'Failed to create session';
            try {
                const data = JSON.parse(text);
                errorMessage = data.message || data.error || errorMessage;
            } catch {}
            showMessage(errorMessage, 'error');
            return;
        }

        const data = await res.json();
        showMessage(`Session "${sessionName}" created successfully! ✓`, 'success');
        
        setTimeout(() => {
            window.location.href = 'schedule.html';
        }, 1500);

    } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('sessionForm').style.opacity = '1';
        document.getElementById('sessionForm').style.pointerEvents = 'auto';
        showMessage('Error: ' + err.message, 'error');
    }
});

function goBack() {
    window.location.href = 'schedule.html';
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadTrainers();
    loadBatches();
    
    // Set today's date
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;
});
</script>

</body>
</html>
