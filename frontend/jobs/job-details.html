<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Details</title>

    <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR STYLES */
         .headers{
            background: #ffffff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            height: 87px;
            position:sticky;
            top: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        
        }
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        .sidebar.hidden {
            left: -250px;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            
        }

        .sidebar ul {
            list-style: none;
            padding: 0 10px;
            background-color: #34495e;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            display: block;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .sidebar ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
            padding-left: 20px;
        }

        .sidebar ul li a.active {
            background: rgba(255, 255, 255, 0.3);
            border-left: 4px solid white;
            padding-left: 20px;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: none;
            border: none;
            cursor: pointer;
            color: #667eea;
            font-size: 28px;
            width: 40px;
            height: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: #667eea;
            border-radius: 3px;
            transition: 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }


        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            margin-left: 250px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 250px);
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 16px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card h1 {
            color: #007bff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .card .company-name {
            font-size: 20px;
            color: #666;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .detail-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }

        .detail-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #666;
            font-size: 16px;
        }

        .description {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #28a745;
            border-radius: 8px;
        }

        .description .label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 10px;
        }

        .description p {
            color: #555;
            line-height: 1.6;
        }

        .apply-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            margin: 20px 0;
            transition: 0.3s;
        }

        .apply-btn:hover {
            background: #0056b3;
        }

        .apply-btn:active {
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .modal-buttons {
            margin-top: 20px;
            text-align: right;
        }

        .modal-buttons button {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-close {
            background: #6c757d;
            color: white;
        }

        .btn-close:hover {
            background: #5a6268;
        }

        .error-text {
            color: #dc3545;
            border-left: 4px solid #dc3545;
            padding: 15px;
            background: #f8d7da;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .success-text {
            color: #155724;
            border-left: 4px solid #28a745;
            padding: 15px;
            background: #d4edda;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .sidebar {
                width: 100%;
                height: 100%;
                left: -100%;
                max-width: none;
            }

            .sidebar.hidden {
                left: -100%;
            }

            .sidebar:not(.hidden) {
                left: 0;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding-top: 50px;
            }

            .card {
                padding: 20px;
            }
            .modal-content {
                width: 90%;
            }
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</button>

<nav class="sidebar" id="sidebar">
    <h2>Portal</h2>
    <ul>
        <li><a href="../student/home.html" onclick="setActive(this)">Home</a></li>
        <li><a href="../student/addStudent.html" onclick="setActive(this)">Add Student</a></li>
        <li><a href="../student/search.html" onclick="setActive(this)">Search Student</a></li>
        <li><a href="../student/schedule.html" onclick="setActive(this)">Schedule</a></li>
        <li><a href="../student/training-schedule.html" onclick="setActive(this)">Training Schedule</a></li>
        <li><a href="browse-jobs.html" class="active">Jobs</a></li>
        <li><a href="../student/attendance-report.html" onclick="setActive(this)">Report</a></li>
        <li style="border-top: 1px solid rgba(255,255,255,0.2); margin-top: 15px; padding-top: 15px;">
            <a href="home.html" onclick="setActive(this)">Job Portal</a>
        </li>
    </ul>
</nav>

<div class="main-content">
       <div class="headers">
       
    </div>
<div class="container">
    
    <div id="details" class="loading">Loading job details...</div>
</div>

<!-- Error/Success Modal -->
<div id="myModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Notification</div>
        <div id="modalMessage"></div>
        <div class="modal-buttons">
            <button class="btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const jobId = params.get("id");

function showModal(message, type = 'info') {
    const modal = document.getElementById('myModal');
    const msgDiv = document.getElementById('modalMessage');
    
    if (type === 'error') {
        msgDiv.innerHTML = `<div class="error-text">${message}</div>`;
    } else if (type === 'success') {
        msgDiv.innerHTML = `<div class="success-text">${message}</div>`;
    } else {
        msgDiv.innerHTML = `<p>${message}</p>`;
    }
    
    modal.style.display = 'block';
}

function closeModal() {
    document.getElementById('myModal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('myModal');
    if (event.target === modal) {
        modal.style.display = 'none';
    }
}

function goBack() {
    window.location.href = "jobs.html";
}

async function loadDetails() {
    try {
        if (!jobId) {
            showModal('Invalid job ID. Redirecting...', 'error');
            setTimeout(() => window.location.href = "jobs.html", 2000);
            return;
        }

        const res = await fetch("http://localhost:8080/jobs/" + jobId);
        
        if (!res.ok) {
            const text = await res.text();
            let errorMessage = 'Job not found';
            
            // Try to extract meaningful error from response
            try {
                const data = JSON.parse(text);
                errorMessage = data.message || data.error || 'Job not found';
            } catch {
                // If HTML error, extract text
                if (text.includes('<') && text.includes('>')) {
                    let match = text.match(/<h[1-2][^>]*>([^<]+)<\/h[1-2]>/i) ||
                                text.match(/<title[^>]*>([^<]+)<\/title>/i);
                    errorMessage = match ? match[1] : 'Failed to load job details';
                }
            }
            
            showModal(errorMessage + '. Redirecting...', 'error');
            setTimeout(() => window.location.href = "jobs.html", 2000);
            return;
        }

        const j = await res.json();

        document.getElementById("details").innerHTML = `
            <div class="card">
                <h1>${j.company}</h1>
                <div class="company-name">${j.role}</div>
                
                <div class="details-grid">
                    <div class="detail-item">
                        <div class="detail-label">💼 Role</div>
                        <div class="detail-value">${j.role}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">💰 Salary</div>
                        <div class="detail-value">₹${j.salary ? j.salary : 'Not specified'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">🔄 Rounds</div>
                        <div class="detail-value">${j.rounds ? j.rounds : 'Not specified'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">📅 Posted</div>
                        <div class="detail-value">${j.postedDate ? j.postedDate : 'Recently'}</div>
                    </div>
                </div>

                <div class="description">
                    <span class="label">📝 Job Description</span>
                    <p>${j.description ? j.description : 'No description provided'}</p>
                </div>

                <button class="apply-btn" onclick="applyJob(${j.id})">
                    ✉️ Apply Now
                </button>
            </div>
        `;
    } catch (err) {
        showModal('Error loading job details: ' + err.message, 'error');
    }
}

function applyJob(id) {
    window.location.href = "apply.html?jobId=" + id;
}

// Load details on page load
loadDetails();

// PERSISTENT SIDEBAR STATE MANAGEMENT
const SidebarState = {
    STORAGE_KEY: 'sidebarState',
    ACTIVE_KEY: 'activePage',
    saveSidebarState(isHidden) {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ hidden: isHidden }));
    },
    getSidebarState() {
        const state = localStorage.getItem(this.STORAGE_KEY);
        return state ? JSON.parse(state).hidden : false;
    },
    saveActivePage(href) {
        localStorage.setItem(this.ACTIVE_KEY, href);
    },
    getActivePage() {
        return localStorage.getItem(this.ACTIVE_KEY) || '';
    }
};

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isCurrentlyHidden = sidebar.classList.contains('hidden');
    sidebar.classList.toggle('hidden');
    hamburger.classList.toggle('active');
    SidebarState.saveSidebarState(!isCurrentlyHidden);
}

function restoreSidebarState() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isSidebarHidden = SidebarState.getSidebarState();
    if (isSidebarHidden && window.innerWidth > 768) {
        sidebar.classList.add('hidden');
        hamburger.classList.add('active');
    }
}

function setActive(element) {
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    element.classList.add('active');
    const href = element.getAttribute('href');
    if (href) SidebarState.saveActivePage(href);
}

function restoreActiveLink() {
    const activePage = SidebarState.getActivePage();
    if (activePage) {
        const link = document.querySelector(`.sidebar a[href="${activePage}"]`);
        if (link) link.classList.add('active');
    }
}

document.querySelectorAll('.sidebar a').forEach(link => {
    link.addEventListener('click', function() {
        setActive(this);
        if (window.innerWidth <= 768) setTimeout(() => toggleSidebar(), 100);
    });
});

document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    if (!sidebar.contains(event.target) && !hamburger.contains(event.target)) {
        if (window.innerWidth <= 768 && !sidebar.classList.contains('hidden')) toggleSidebar();
    }
});

window.addEventListener('DOMContentLoaded', function() {
    restoreSidebarState();
    restoreActiveLink();
}, { once: true });
</script>

</div>
</div>

</body>
</html>
