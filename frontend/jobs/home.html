<!DOCTYPE html>
<html>
<head>
    <title>Job Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            text-align: center;
            background: #eef2f7;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR STYLES */
        .sidebar {
            width: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        .sidebar.hidden {
            left: -250px;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0 10px;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            display: block;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .sidebar ul li a:hover {
            background: rgba(255, 255, 255, 0.2);
            padding-left: 20px;
        }

        .sidebar ul li a.active {
            background: rgba(255, 255, 255, 0.3);
            border-left: 4px solid white;
            padding-left: 20px;
        }

        .hamburger {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: none;
            border: none;
            cursor: pointer;
            color: #667eea;
            font-size: 28px;
            width: 40px;
            height: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 3px;
            background: #667eea;
            border-radius: 3px;
            transition: 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            margin-left: 250px;
            transition: margin-left 0.3s ease;
            width: calc(100% - 250px);
            padding: 20px;
        }

        h1 {
            background: #222;
            color: white;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        a {
            display: block;
            margin: 20px auto;
            width: 200px;
            padding: 12px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .sidebar {
                width: 100%;
                height: 100%;
                left: -100%;
                max-width: none;
            }

            .sidebar.hidden {
                left: -100%;
            }

            .sidebar:not(.hidden) {
                left: 0;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding-top: 50px;
            }

            h1 {
                font-size: 1.5em;
            }

            a {
                width: 90%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</button>

<nav class="sidebar" id="sidebar">
    <h2>📚 Portal</h2>
    <ul>
        <li><a href="../student/home.html" onclick="setActive(this)">🏠 Student Home</a></li>
        <li><a href="../student/addStudent.html" onclick="setActive(this)">👥 Add Student</a></li>
        <li><a href="../student/search.html" onclick="setActive(this)">🔍 Search Student</a></li>
        <li><a href="../student/schedule.html" onclick="setActive(this)">📅 Schedule</a></li>
        <li><a href="../student/create-session.html" onclick="setActive(this)">🎓 Create Session</a></li>
        <li><a href="../student/training-schedule.html" onclick="setActive(this)">📖 Training Schedule</a></li>
        <li><a href="../student/session-attendance.html" onclick="setActive(this)">✅ Attendance</a></li>
        <li><a href="../student/attendance-report.html" onclick="setActive(this)">📊 Report</a></li>
        <li style="border-top: 1px solid rgba(255,255,255,0.2); margin-top: 15px; padding-top: 15px;">
            <a href="home.html" class="active" onclick="setActive(this)">💼 Job Portal</a>
        </li>
    </ul>
</nav>

<div class="main-content">

<h1>💼 Job Portal</h1>

<a href="jobs.html">📌 Manage Jobs</a>
<a href="apply.html">🎯 Apply for Job</a>
<a href="browse-jobs.html">🔍 Browse Jobs</a>

</div>

<script>
// SIDEBAR TOGGLE
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isCurrentlyHidden = sidebar.classList.contains('hidden');
    
    sidebar.classList.toggle('hidden');
    hamburger.classList.toggle('active');
    
    // Save to localStorage
    localStorage.setItem('sidebarState', JSON.stringify({ hidden: !isCurrentlyHidden }));
}

function restoreSidebarState() {
    const state = localStorage.getItem('sidebarState');
    if (state) {
        const { hidden } = JSON.parse(state);
        const sidebar = document.getElementById('sidebar');
        const hamburger = document.getElementById('hamburger');
        if (hidden && window.innerWidth > 768) {
            sidebar.classList.add('hidden');
            hamburger.classList.add('active');
        }
    }
}

function setActive(element) {
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    element.classList.add('active');
    const href = element.getAttribute('href');
    if (href) localStorage.setItem('activePage', href);
}

function restoreActiveLink() {
    const activePage = localStorage.getItem('activePage');
    if (activePage) {
        const link = document.querySelector(`.sidebar a[href="${activePage}"]`);
        if (link) link.classList.add('active');
    }
}

// CLOSE SIDEBAR ON LINK CLICK (MOBILE)
document.querySelectorAll('.sidebar a').forEach(link => {
    link.addEventListener('click', function() {
        setActive(this);
        if (window.innerWidth <= 768) {
            setTimeout(() => toggleSidebar(), 100);
        }
    });
});

// CLOSE SIDEBAR WHEN CLICKING OUTSIDE
document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    if (!sidebar.contains(event.target) && !hamburger.contains(event.target)) {
        if (window.innerWidth <= 768 && !sidebar.classList.contains('hidden')) {
            toggleSidebar();
        }
    }
});

// Initialize on load
window.addEventListener('DOMContentLoaded', function() {
    restoreSidebarState();
    restoreActiveLink();
});
</script>

</body>
</html>
