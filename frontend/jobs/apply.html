            background-color: rgba(0, 0, 0, 0.5);

            justify-content: center;

        .modal-content {

        @keyframes slideIn {
            from {

                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 22px;

            margin-bottom: 15px;

        }

        .modal-body {

        .modal-buttons {
            margin-top: 20px;
            text-align: right;
        }

        .modal-buttons button {
            display: inline-block;
            width: auto;
            padding: 10px 20px;

            margin-top: 0;
        }

        .btn-close {
            background: #6c757d;
            color: white;
        }

        .btn-close:hover {

        }

        .error-message {

            border-left: 4px solid #dc3545;
            padding: 15px;

            border-radius: 5px;
            margin-bottom: 15px;

        .success-message {

            border-left: 4px solid #28a745;

            margin-bottom: 15px;

    <form id="applyForm" enctype="multipart/form-data">

<!-- Error/Success Modal -->
<div id="responseModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Application Status</div>
        <div class="modal-body" id="modalMessage"></div>
        <div class="modal-buttons">
            <button class="btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>
</div></center></div></div>

<script>
const params = new URLSearchParams(window.location.search);
const jobId = params.get("jobId");

function goBack() {
    window.history.back();
}

function showModal(message, type = 'info') {
    const modal = document.getElementById('responseModal');
    const msgDiv = document.getElementById('modalMessage');
    
    if (type === 'error') {
        msgDiv.innerHTML = `<div class="error-message">${message}</div>`;
    } else if (type === 'success') {
        msgDiv.innerHTML = `<div class="success-message">${message}</div>`;
    } else {
        msgDiv.innerHTML = `<div class="info-message">${message}</div>`;
    }
    
    modal.classList.add('show');
}

function closeModal() {
    const modal = document.getElementById('responseModal');
    modal.classList.remove('show');
}

window.onclick = function(event) {
    const modal = document.getElementById('responseModal');
    if (event.target === modal) {
        closeModal();
    }
}

document.getElementById("applyForm").onsubmit = async (e) => {
    e.preventDefault();

    if (!jobId) {
        showModal('Job ID is missing. Please select a job first.', 'error');
        return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ Submitting...';

    try {
        const formData = new FormData(e.target);
        formData.append("jobId", jobId);

        const res = await fetch("http://localhost:8080/apply", {
            method: "POST",
            body: formData
        });

        const responseText = await res.text();
        
        if (!res.ok) {
            let errorMessage = 'Application submission failed';
            
            // Try to parse as JSON first
            try {
                const errorData = JSON.parse(responseText);
                errorMessage = errorData.message || errorData.error || errorData.msg || 'Application submission failed';
            } catch {
                // If not JSON, try to extract error message from HTML or plain text
                
                // Check if it's HTML (contains HTML tags)
                if (responseText.includes('<') && responseText.includes('>')) {
                    // Try to extract text from common error patterns
                    let extracted = responseText;
                    
                    // Extract from h1, h2, title tags
                    let h1Match = responseText.match(/<h1[^>]*>([^<]+)<\/h1>/i);
                    let h2Match = responseText.match(/<h2[^>]*>([^<]+)<\/h2>/i);
                    let titleMatch = responseText.match(/<title[^>]*>([^<]+)<\/title>/i);
                    let prMatch = responseText.match(/<pre[^>]*>([^<]+)<\/pre>/i);
                    let pMatch = responseText.match(/<p[^>]*>([^<]+)<\/p>/i);
                    
                    if (h1Match) extracted = h1Match[1];
                    else if (h2Match) extracted = h2Match[1];
                    else if (prMatch) extracted = prMatch[1];
                    else if (pMatch) extracted = pMatch[1];
                    else if (titleMatch) extracted = titleMatch[1];
                    else {
                        // Remove all HTML tags
                        extracted = responseText
                            .replace(/<[^>]*>/g, ' ')
                            .replace(/\s+/g, ' ')
                            .trim()
                            .substring(0, 200);
                    }
                    
                    errorMessage = extracted || 'Application submission failed';
                } else {
                    // Plain text response
                    errorMessage = responseText.trim() || 'Application submission failed';
                }
            }
            
            // Clean up common error messages
            errorMessage = errorMessage
                .replace(/Internal Server Error/gi, 'Server Error')
                .trim();
            
            showModal(errorMessage, 'error');
        } else {
            // Success response
            try {
                const successData = JSON.parse(responseText);
                const successMessage = successData.message || successData.msg || 'Application submitted successfully! 🎉';
                showModal(successMessage, 'success');
            } catch {
                showModal('Application submitted successfully! 🎉', 'success');
            }
            
            // Clear form
            document.getElementById("applyForm").reset();
            
            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = "job-details.html?id=" + jobId;
            }, 2000);
        }
    } catch (err) {
        showModal('Network error: ' + err.message, 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '✉️ Submit Application';
    }
};
</script>

<script>
// PERSISTENT SIDEBAR STATE MANAGEMENT
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    const isCurrentlyHidden = sidebar.classList.contains('hidden');
    sidebar.classList.toggle('hidden');
    hamburger.classList.toggle('active');
    localStorage.setItem('sidebarState', JSON.stringify({ hidden: !isCurrentlyHidden }));
}

function restoreSidebarState() {
    const state = localStorage.getItem('sidebarState');
    if (state) {
        const { hidden } = JSON.parse(state);
        if (hidden && window.innerWidth > 768) {
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('hamburger').classList.add('active');
        }
    }
}

function setActive(element) {
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    element.classList.add('active');
    const href = element.getAttribute('href');
    if (href) localStorage.setItem('activePage', href);
}

function restoreActiveLink() {
    const activePage = localStorage.getItem('activePage');
    if (activePage) {
        const link = document.querySelector(`.sidebar a[href="${activePage}"]`);
        if (link) link.classList.add('active');
    }
}

document.querySelectorAll('.sidebar a').forEach(link => {
    link.addEventListener('click', function() {
        setActive(this);
        if (window.innerWidth <= 768) setTimeout(() => toggleSidebar(), 100);
    });
});

document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    if (!sidebar.contains(event.target) && !hamburger.contains(event.target)) {
        if (window.innerWidth <= 768 && !sidebar.classList.contains('hidden')) toggleSidebar();
    }
});

window.addEventListener('DOMContentLoaded', function() {
    restoreSidebarState();
    restoreActiveLink();
});
</script>
